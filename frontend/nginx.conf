# ── Imagen Frontend Nginx Config ──────────────────────────────
#
# Serves the React SPA and reverse-proxies API calls to the
# backend service. All API routes are under /api/ so nginx can
# distinguish SPA page navigation (e.g. /jobs, /prompts) from
# actual API requests (e.g. /api/jobs, /api/prompts/show).
#
#   Browser → External nginx (SSL :443) → this (:80)
#                                            ├── /api/*      → api:3000 (strip /api)
#                                            └── /*          → SPA static files

# Use Docker's internal DNS resolver; nginx resolves at request
# time so backend can start after frontend.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── API reverse proxy ─────────────────────────────────────
    # Strip /api prefix before forwarding to backend.
    # Backend sees: /health, /jobs, /prompts/show, etc.
    location /api/ {
        set $api_upstream api:3000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(?:css|js|svg|png|ico|woff2|json|txt)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
